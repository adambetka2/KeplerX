[package]
name = "forgotten-stars-search"
version = "0.1.0"
edition = "2024"
description = "Blind, event-first transit verifier for the Forgotten Stars Corpus"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
