[project]
name = "forgotten-stars-third-campaign"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4", "scipy==1.13.1", "pandas==2.3.3", "pyarrow==21.0.0",
  "astropy>=7.1,<8", "astroquery==0.4.11", "batman-package==2.5.2",
  "PyWavelets>=1.6", "fast-histogram>=0.14", "statsmodels>=0.14",
  "wotan>=1.10", "tables>=3.9", "tqdm>=4.66", "lmfit>=1.3.4",
  "matplotlib>=3.10.8,<4", "lkprf==1.1.1", "lamatrix>=1.0.1",
  "cmasher>=1.9.2", "diskcache>=5.6.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["**/upstream/**", "runtime", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
